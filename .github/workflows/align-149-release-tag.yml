# Lease-guarded correction of a release tag following source and documentation synchronization.
# The published installer ZIP is immutable and is NEVER modified by this workflow.
name: Align 1.4.9 source tag with verified runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/align-149-release-tag.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  align-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate current source against exact published ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 3 --output "$RUNNER_TEMP/ResonaDeck-1.4.9.zip" \
            "https://github.com/ValentineBSAA/ResonaDeck/releases/download/1.4.9/ResonaDeck-1.4.9.zip"
          echo "73b2a120edc3048b15836bc326a083394e369b47257c545c91293ddbc8eb1b0d  $RUNNER_TEMP/ResonaDeck-1.4.9.zip" | sha256sum -c -
          export INSTALLER="$RUNNER_TEMP/ResonaDeck-1.4.9.zip"
          python3 - <<'PY'
          import json, os, pathlib, zipfile
          archive=pathlib.Path(os.environ['INSTALLER'])
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              for path in ["dist/index.js","main.py","plugin.json","package.json","resonadeck_backend.py","jellyfin_provider.py","jellyfin_discovery.py"]:
                  assert pathlib.Path(path).read_bytes() == z.read('ResonaDeck/'+path), f'mismatch: {path}'
              assert json.loads(pathlib.Path('package.json').read_text())['version']=='1.4.9'
              assert json.loads(pathlib.Path('plugin.json').read_text())['version']=='1.4.9'
          print('Verified 1.4.9: source bytes match published installer')
          PY
      - name: Correct original tag only if it still points to the observed old source
        shell: bash
        run: |
          set -euo pipefail
          expected_old="78cc6eec388dcef9dd1e9e23314dc2b729598b5f"
          current="$(git ls-remote --tags origin "refs/tags/1.4.9" | awk '{print $1}')"
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo "1.4.9 already points to this verified commit"
            exit 0
          fi
          if [[ "$current" != "$expected_old" ]]; then
            echo "::error::Tag was independently moved. Expected $expected_old, got $current; refusing to rewrite."
            exit 1
          fi
          git push --force-with-lease="refs/tags/1.4.9:$expected_old" origin "HEAD:refs/tags/1.4.9"
          echo "1.4.9 aligned to verified source commit $GITHUB_SHA"
