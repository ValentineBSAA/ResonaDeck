name: Import official ResonaDeck 1.2.0 screenshot gallery

# One-time import of verified user-provided release asset, without replacing older imagery.
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-v1-2-screenshots.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-verified-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out gallery source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Download and authenticate uploaded screenshot ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download 1.2.0 --repo "${{ github.repository }}" \
            --pattern 'ResonaDeck.Screenshots.2.zip' --dir /tmp
          echo '9482f8ae9be45c6c54392f7f8b26100c3a07fed8bb419c8792929a011a9c535f  /tmp/ResonaDeck.Screenshots.2.zip' | sha256sum --check
          unzip -t /tmp/ResonaDeck.Screenshots.2.zip

      - name: Import the four new 1.2.0 screenshots with descriptive filenames
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/ResonaDeck.Screenshots.2.zip
          mkdir -p docs/screenshots/v1.2.0
          unzip -p "$archive" 'ResonaDeck Screenshots/1.2.0/IMG_8969.JPG' > docs/screenshots/v1.2.0/01-player-crossfade-status.jpg
          unzip -p "$archive" 'ResonaDeck Screenshots/1.2.0/IMG_8970.JPG' > docs/screenshots/v1.2.0/02-music-albums.jpg
          unzip -p "$archive" 'ResonaDeck Screenshots/1.2.0/IMG_8971.JPG' > docs/screenshots/v1.2.0/03-surprise-me-turntable.jpg
          unzip -p "$archive" 'ResonaDeck Screenshots/1.2.0/IMG_8972.JPG' > docs/screenshots/v1.2.0/04-surprise-me-settings.jpg
          test "$(find docs/screenshots/v1.2.0 -name '*.jpg' -type f | wc -l)" -eq 4
          for image in docs/screenshots/v1.2.0/*.jpg; do
            test "$(wc -c < "$image")" -gt 100000
            head -c 3 "$image" | od -An -t x1 | grep -iq 'ff d8 ff'
          done
          du -h docs/screenshots/v1.2.0/*

      - name: Publish new shots, without deleting original gallery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/v1.2.0
          if git diff --cached --quiet; then
            echo 'New screenshot assets are already present.'
            exit 0
          fi
          git commit -m 'docs: import four verified 1.2.0 Steam Deck screenshots'
          git push origin HEAD:main
