name: ResonaDeck source checks
on:
  push:
    branches: [main, release-prep/**]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Source and release metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,re
          root=pathlib.Path('.')
          package=json.loads((root/'package.json').read_text())
          plugin=json.loads((root/'plugin.json').read_text())
          version=package['version']
          assert package['name']=='resonadeck'
          assert plugin['name']=='ResonaDeck'
          assert re.fullmatch(r'\d+\.\d+\.\d+',version)
          assert plugin['version']==version
          assert (root/'dist/index.js').read_bytes()==(root/'src/index.js').read_bytes()
          assert f"const RD_VERSION = '{version}';".encode() in (root/'dist/index.js').read_bytes()
          assert version in (root/'README.md').read_text()
          if version=='1.4.9':
              assert (root/'RELEASE_NOTES_1.4.9.md').exists()
          print('PASS ResonaDeck runtime', version)
          PY
          python3 -m py_compile main.py resonadeck_backend.py jellyfin_provider.py jellyfin_discovery.py
          node --check dist/index.js
          node --check src/index.js
      - name: Historical tests only for original baseline
        run: |
          VERSION="$(python3 -c 'import json;print(json.load(open("package.json"))["version"])')"
          if [[ "$VERSION" == "1.4.1" ]]; then
            for test in tests/test_resonadeck_141_crossfade.cjs tests/test_resonadeck_141_pcm.cjs tests/test_resonadeck_141_queue.cjs tests/test_resonadeck_141_ui.cjs tests/test_resonadeck_141_sleep.cjs; do
              if [[ -f "$test" ]]; then node "$test"; fi
            done
            for test in tests/test_resonadeck_141_power.py tests/test_resonadeck_141_persistence.py; do
              if [[ -f "$test" ]]; then python3 "$test"; fi
            done
          else
            echo "Old fixed-version tests skipped for newer runtime; release QA performed separately."
          fi
