name: ResonaDeck release metadata and regressions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify current code, manifests and release documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, json, re
          root=pathlib.Path(".")
          package=json.loads((root/"package.json").read_text())
          plugin=json.loads((root/"plugin.json").read_text())
          version=package["version"]
          assert package["name"]=="resonadeck"
          assert plugin["name"]=="ResonaDeck"
          assert plugin["version"]==version
          assert re.fullmatch(r"\d+\.\d+\.\d+",version)
          assert package["repository"]["url"]=="https://github.com/ValentineBSAA/ResonaDeck.git"
          assert (root/"src/index.js").read_bytes()==(root/"dist/index.js").read_bytes()
          assert f"const RD_VERSION = '{version}';".encode() in (root/"dist/index.js").read_bytes()
          assert f"ResonaDeck-{version}.zip" in (root/"README.md").read_text()
          assert (root/f"RELEASE_NOTES_{version}.md").is_file()
          print("PASS ResonaDeck metadata",version)
          PY
          python3 -m py_compile main.py resonadeck_backend.py jellyfin_provider.py jellyfin_discovery.py
          node --check dist/index.js
          node --check src/index.js
          cmp src/index.js dist/index.js
      - name: Test ResonaDeck 1.4.1 playback and settings
        if: always()
        run: |
          set -euo pipefail
          node tests/test_resonadeck_141_crossfade.cjs
          node tests/test_resonadeck_141_pcm.cjs
          node tests/test_resonadeck_141_queue.cjs
          node tests/test_resonadeck_141_ui.cjs
          node tests/test_resonadeck_141_sleep.cjs
          python3 tests/test_resonadeck_141_power.py
          python3 tests/test_resonadeck_141_persistence.py
# The cross-repository GTM bridge integration test requires a GTM 4.1.2 checkout
# and is run as a separate integration check documented in tests/README.md.
