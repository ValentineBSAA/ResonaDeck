name: Import verified ResonaDeck 1.0.0 source

# One-shot import of the exact code already distributed in our public v1.0.0 ZIP.
# Also supports manual re-run; no runtime source code is executed.
on:
  push:
    paths:
      - .github/workflows/import-v1-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download and verify published 1.0.0 archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/ValentineBSAA/ResonaDeck/releases/download/1.0.0/ResonaDeck-1.0.0.zip' \
            --output /tmp/ResonaDeck-1.0.0.zip
          echo 'e09416573796a432ec2fc093f613108d79929134677dbad6cba5efb37675dd7a  /tmp/ResonaDeck-1.0.0.zip' | sha256sum --check
          unzip -q /tmp/ResonaDeck-1.0.0.zip -d /tmp/resonadeck-original
          test -f /tmp/resonadeck-original/ResonaDeck/src/index.js
          test -f /tmp/resonadeck-original/ResonaDeck/dist/index.js
          test -f /tmp/resonadeck-original/ResonaDeck/resonadeck_backend.py
          cmp /tmp/resonadeck-original/ResonaDeck/src/index.js /tmp/resonadeck-original/ResonaDeck/dist/index.js

      - name: Publish complete runtime source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          origin=/tmp/resonadeck-original/ResonaDeck
          for directory in src dist assets mutagen tests third_party; do
            mkdir -p "$directory"
            cp -a "$origin/$directory/." "$directory/"
          done
          for file in main.py resonadeck_backend.py package.json plugin.json CHANGELOG.md BUILD_NOTES.md RELEASE_VALIDATION_1.0.0.md; do
            cp "$origin/$file" "$file"
          done
          python -m py_compile main.py resonadeck_backend.py
          test -f src/index.js
          test -f assets/resonadeck-icon.webp
          test -f tests/verify-menu-dpad-queue-count-050.cjs || find tests -maxdepth 1 -type f -name '*050*'
          git status --short

      - name: Commit imported source without changing the release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src dist assets mutagen tests third_party \
            main.py resonadeck_backend.py package.json plugin.json CHANGELOG.md BUILD_NOTES.md RELEASE_VALIDATION_1.0.0.md
          if git diff --cached --quiet; then
            echo 'Source tree already matches public 1.0.0 release.'
            exit 0
          fi
          git commit -m 'source: publish complete audited ResonaDeck 1.0.0 implementation'
          git push origin HEAD:main
