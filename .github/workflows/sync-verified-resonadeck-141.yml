name: Sync verified ResonaDeck 1.4.1 beta runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-verified-resonadeck-141.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Recover exact tested runtime from published GitHub beta ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/ResonaDeck.zip" 'https://github.com/ValentineBSAA/ResonaDeck/releases/download/1.4.1/ResonaDeck-1.4.1.zip'
          echo 'f865f9a8dcc5c167b0e15eb785492428a135c313abdd1a2c491254acb051500d  '"$RUNNER_TEMP/ResonaDeck.zip" | sha256sum -c -
          export ARCHIVE="$RUNNER_TEMP/ResonaDeck.zip"
          python3 - <<'PY'
          import os, zipfile, pathlib
          files=("main.py","package.json","plugin.json","resonadeck_backend.py","jellyfin_discovery.py","jellyfin_provider.py","dist/index.js")
          with zipfile.ZipFile(os.environ["ARCHIVE"]) as z:
              for path in files:
                  target=pathlib.Path(path)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read("ResonaDeck/" + path))
              pathlib.Path("src").mkdir(exist_ok=True)
              pathlib.Path("src/index.js").write_bytes(z.read("ResonaDeck/dist/index.js"))
              for name in z.namelist():
                  if name.startswith("ResonaDeck/assets/") and not name.endswith("/"):
                      target=pathlib.Path(name.removeprefix("ResonaDeck/"))
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(z.read(name))
          PY
          node --check dist/index.js
          python3 -m py_compile main.py resonadeck_backend.py jellyfin_discovery.py jellyfin_provider.py
          python3 - <<'PY'
          import json
          for p in ('package.json','plugin.json'):
              assert json.load(open(p))['version'] == '1.4.1'
          print('Verified ResonaDeck 1.4.1 runtime metadata.')
          PY
      - name: Commit only recovered sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py package.json plugin.json resonadeck_backend.py jellyfin_discovery.py jellyfin_provider.py dist/index.js src/index.js assets
          if git diff --cached --quiet; then echo 'Source already up to date'; exit 0; fi
          git commit -m "source: sync verified ResonaDeck 1.4.1 beta runtime"
          git push
