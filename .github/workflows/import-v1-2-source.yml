name: Import verified ResonaDeck 1.2.0 stable source

# Synchronize the exact source and assets in the already-published stable ZIP.
# The release ZIP checksum is checked before any files are copied.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-v1-2-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-resonadeck-1-2-0
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Download and authenticate published 1.2.0 Stable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --silent --show-error \
            'https://github.com/ValentineBSAA/ResonaDeck/releases/download/1.2.0/ResonaDeck-1.2.0-Stable.zip' \
            --output /tmp/ResonaDeck-1.2.0-Stable.zip
          echo '66148bf5e02114282c964bf46f2d6f0f89934d6184e6eecd2ea8a4ac8d8b21f2  /tmp/ResonaDeck-1.2.0-Stable.zip' | sha256sum --check
          unzip -q /tmp/ResonaDeck-1.2.0-Stable.zip -d /tmp/resonadeck-stable
          origin=/tmp/resonadeck-stable/ResonaDeck
          test -f "$origin/src/index.js"
          test -f "$origin/dist/index.js"
          test -f "$origin/resonadeck_backend.py"
          test -f "$origin/plugin.json"
          cmp "$origin/src/index.js" "$origin/dist/index.js"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/resonadeck-stable/ResonaDeck')
          assert json.loads((root/'plugin.json').read_text())['version']=='1.2.0'
          assert json.loads((root/'package.json').read_text())['version']=='1.2.0'
          print('Verified stable manifest version and compiled source parity.')
          PY

      - name: Synchronize public runtime code and release documentation
        shell: bash
        run: |
          set -euo pipefail
          origin=/tmp/resonadeck-stable/ResonaDeck
          for directory in src dist assets mutagen tests third_party; do
            mkdir -p "$directory"
            rsync -a "$origin/$directory/" "$directory/"
          done
          for file in main.py resonadeck_backend.py package.json plugin.json \
            CHANGELOG.md BUILD_NOTES.md UPDATE_LEDGER.md \
            FEATURE_STATUS_1.2.0.md RELEASE_NOTES_1.2.0.md \
            THIRD-PARTY-NOTICES.md; do
            cp "$origin/$file" "$file"
          done
          python -m py_compile main.py resonadeck_backend.py
          node --check src/index.js
          node --check dist/index.js
          cmp src/index.js dist/index.js
          git status --short

      - name: Commit verified source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src dist assets mutagen tests third_party \
            main.py resonadeck_backend.py package.json plugin.json \
            CHANGELOG.md BUILD_NOTES.md UPDATE_LEDGER.md \
            FEATURE_STATUS_1.2.0.md RELEASE_NOTES_1.2.0.md \
            THIRD-PARTY-NOTICES.md
          if git diff --cached --quiet; then
            echo 'Repository source already matches published 1.2.0 stable package.'
            exit 0
          fi
          git commit -m 'source: synchronize verified ResonaDeck 1.2.0 stable release'
          git push origin HEAD:main

      - name: Align the published tag to the verified 1.2.0 source and docs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git fetch --no-tags origin 'refs/tags/1.2.0:refs/tags/1.2.0'
          current="$(git rev-parse 'refs/tags/1.2.0')"
          target="$(git rev-parse 'refs/remotes/origin/main')"
          if [ "$current" = "$target" ]; then
            echo '1.2.0 tag already targets the verified stable source.'
            exit 0
          fi
          test -f src/index.js
          grep -q '"version": "1.2.0"' plugin.json
          echo "Move 1.2.0 source tag from $current to $target"
          git tag -f 1.2.0 "$target"
          git push --force origin refs/tags/1.2.0:refs/tags/1.2.0
